<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Моя коллекция</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <header class="header">
            <h1>Мои домашние хомяки</h1>
        </header>

        <main class="container">
            <p id="status" class="status">Загрузка...</p>

            <div id="cards" class="cards">
                <article class="card">
                    <img
                        class="card__image"
                        src="https://via.placeholder.com/300x200"
                        alt="Фото_хомяка" />
                    <div class="card__body">
                        <h2 class="card__title">Имя хомяка</h2>
                        <p class="card__text">Цвет</p>
                        <p class="card__text">Пол</p>
                        <p class="card__text">Вес г.</p>
                        <div class="card__footer">
                            <span class="card__price">Порода</span>
                            <span class="badge badge--yes">Дата рождения</span>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </body>
</html>
